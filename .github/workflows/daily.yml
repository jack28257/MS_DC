name: Publish daily challenges

on:
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Toronto'
  workflow_dispatch:
  push:
    paths:
      - 'generate_daily.py'
      - 'mirror_daily_validator.py'
      - 'test_daily.py'
      - '.github/workflows/daily.yml'

permissions:
  contents: write

concurrency:
  group: daily-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generation and solutions
        run: python3 -m unittest -v test_daily
      - name: Generate and validate today's puzzle
        run: python3 generate_daily.py
      - name: Commit daily data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DailyChallenge.json challenges/
          if git diff --cached --quiet; then
            echo 'Daily data is already current.'
          else
            git commit -m 'Publish today’s validated daily challenge'
            git push origin HEAD:main
          fi
